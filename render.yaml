# Deploy on Render: https://render.com — New > Blueprint > connect repo
services:
  - type: web
    name: surakhsa-core
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: SHOW_DEMO_OTP
        value: "true"
      - key: REACT_APP_DEMO_MODE
        value: "true"
